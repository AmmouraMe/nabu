<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Web-app icons — full set (see nabu/CLAUDE.md). Order matters: SVG is the
		     primary icon for browsers that support it; the .ico is the legacy
		     fallback; the two PNGs let the tab favicon adapt to the UA color scheme.
		     apple-touch-icon + manifest drive iOS home-screen tiles and PWA installs,
		     which ignore <link rel="icon"> entirely. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-dark.png"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-light.png"
			media="(prefers-color-scheme: light)"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Nabu" />
		<meta name="theme-color" content="#0a0a0a" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Prevent FOUC by setting theme immediately
			(function () {
				var stored = localStorage.getItem('theme-preference');
				var theme = 'light';

				if (stored === 'light' || stored === 'dark') {
					theme = stored;
				} else if (stored === 'system' || !stored) {
					// Use system preference
					if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
						theme = 'dark';
					}
				}

				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
