# Pages project name. All bound resources below are Nabu's own, on the *Space
# account — see the D1 block for why that matters.
name = "nabu"
compatibility_date = "2024-01-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

# StarSpace account — required so the local Workers AI binding can pick an
# account non-interactively (the OAuth login exposes multiple accounts).
account_id = "f6dece8a25710d1e02a529144cfc3344"

# D1 Database — Nabu's own, on the *Space account.
# Created 2026-07-23 with: wrangler d1 create nabu-db
#
# These IDs were previously copied verbatim from the convey.land project
# (database_id bd776be3-…, KV 12a65763-…). D1 binds by *id*, so that pointed
# Nabu at another project's database and KV — and the migration filenames
# diverge from 0004 on, so applying Nabu's migrations there would have
# interleaved two unrelated schemas in one d1_migrations table. Nothing had
# been written (no remote resources existed on this account), but do not
# reintroduce another project's IDs here.
[[d1_databases]]
binding = "DB"
database_name = "nabu-db"
database_id = "3804142a-d754-4d02-98a7-86113e2b00b5"
migrations_dir = "./migrations"

# KV Namespace
# Created with: wrangler kv namespace create KV   (and again with --preview)
[[kv_namespaces]]
binding = "KV"
id = "771c669e06344160960e963bbb99b34f"
preview_id = "da23de6c55b54ca89b93a6023e464ece"

# R2 Bucket
# NOT YET CREATED: R2 is not enabled on the *Space account (API returns 10042).
# Enable R2 in the Cloudflare dashboard, then: wrangler r2 bucket create nabu-files
# R2 binds by name, so this resolves as soon as the bucket exists.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nabu-files"

# Queue (disabled - enable Queues at https://dash.cloudflare.com before uncommenting)
# [[queues.producers]]
# binding = "QUEUE"
# queue = "nebulakit-queue"

# Note: queues.consumers is not supported by Cloudflare Pages
# If you need queue consumers, use a separate Cloudflare Worker

# Workers AI
# Free tier: https://developers.cloudflare.com/workers-ai/
[ai]
binding = "AI"

# Cron Triggers (Monday 9am UTC — generates weekly content calendar)
# Note: For Cloudflare Pages, deploy a standalone Worker that calls /api/cron/content
# with Authorization: Bearer <CRON_SECRET>
[triggers]
crons = ["0 9 * * 1"]

# Environment Variables
# For production, set these in Cloudflare Pages settings
# For local dev, use .env file (see .env.example)
[vars]
# TURNSTILE_SECRET_KEY will be set via environment
# GITHUB_OWNER_ID - Set this to your GitHub user ID to enable admin access
# To find your GitHub ID: visit https://api.github.com/users/YOUR_USERNAME
# GITHUB_OWNER_ID = "YOUR_GITHUB_USER_ID_HERE"
# CRON_SECRET - Random secret for authorizing the /api/cron/content endpoint
