# Pages project name. All bound resources below are Nabu's own, on the *Space
# account — see the D1 block for why that matters.
name = "nabu"
# Bumped from 2024-01-01 together with the nodejs_compat flag below. The built
# _worker.js imports `node:async_hooks` (SvelteKit's adapter-cloudflare needs it),
# and without the flag wrangler warns the Worker "may throw errors at runtime".
# 2024-09-23 is the date at which nodejs_compat switches to its v2 behaviour, which
# is the combination adapter-cloudflare expects. Safe to move here because nothing
# had ever been deployed against the old date.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# NOTE: `account_id` cannot live here. Pages configs reject it ("Configuration file
# for Pages projects does not support 'account_id'"), which fails every
# `wrangler pages …` command before it runs.
#
# It was here to let the local Workers AI binding pick an account non-interactively,
# since the wrangler OAuth login can see more than one. That job belongs to
# CLOUDFLARE_ACCOUNT_ID in .dev.vars (already set, and documented in
# .dev.vars.example) — the *Space account is f6dece8a25710d1e02a529144cfc3344.

# D1 Database — Nabu's own, on the *Space account.
# Created 2026-07-23 with: wrangler d1 create nabu-db
#
# These IDs were previously copied verbatim from the convey.land project
# (database_id bd776be3-…, KV 12a65763-…). D1 binds by *id*, so that pointed
# Nabu at another project's database and KV — and the migration filenames
# diverge from 0004 on, so applying Nabu's migrations there would have
# interleaved two unrelated schemas in one d1_migrations table. Nothing had
# been written (no remote resources existed on this account), but do not
# reintroduce another project's IDs here.
[[d1_databases]]
binding = "DB"
database_name = "nabu-db"
database_id = "3804142a-d754-4d02-98a7-86113e2b00b5"
migrations_dir = "./migrations"

# KV Namespace
# Created with: wrangler kv namespace create KV   (and again with --preview)
[[kv_namespaces]]
binding = "KV"
id = "771c669e06344160960e963bbb99b34f"
preview_id = "da23de6c55b54ca89b93a6023e464ece"

# R2 Bucket
# NOT YET CREATED: R2 is not enabled on the *Space account (API returns 10042).
# Enable R2 in the Cloudflare dashboard, then: wrangler r2 bucket create nabu-files
# R2 binds by name, so this resolves as soon as the bucket exists.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nabu-files"

# Queue (disabled - enable Queues at https://dash.cloudflare.com before uncommenting)
# [[queues.producers]]
# binding = "QUEUE"
# queue = "nebulakit-queue"

# Note: queues.consumers is not supported by Cloudflare Pages
# If you need queue consumers, use a separate Cloudflare Worker

# Workers AI
# Free tier: https://developers.cloudflare.com/workers-ai/
[ai]
binding = "AI"

# Cron Triggers — NOT configurable here.
#
# Pages projects reject a [triggers] block outright ("Configuration file for Pages
# projects does not support 'triggers'"), which fails `wrangler pages secret put`
# and `wrangler pages deploy` before they do anything. The block that used to sit
# here (crons = ["0 9 * * 1"], Monday 9am UTC for the weekly content calendar) had
# therefore never taken effect — it only ever blocked deploys.
#
# The weekly calendar still needs a scheduler: deploy a standalone Worker with its
# own cron trigger that calls POST /api/cron/content with
# `Authorization: Bearer <CRON_SECRET>`. Not yet set up.

# Environment Variables
# For production, set these in Cloudflare Pages settings
# For local dev, use .env file (see .env.example)
[vars]
# TURNSTILE_SECRET_KEY will be set via environment
# GitHub user ID that gets owner/admin rights. davis9001; public data, from
# https://api.github.com/users/davis9001. The callbacks check this env var first
# and fall back to KV `github_owner_id`. Leaving it unset makes isOwner false for
# everyone, which locks the admin panel to nobody.
GITHUB_OWNER_ID = "72961"
# CRON_SECRET - Random secret for authorizing the /api/cron/content endpoint
