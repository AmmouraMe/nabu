name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Keep this on a current LTS and reasonably close to local dev. Node 18 is EOL,
  # and the skew matters: Node 25 ships its own inert global `localStorage`,
  # which broke the theme tests until tests/setup.ts started polyfilling it.
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # Coverage thresholds (95% lines/branches/functions/statements) are
      # enforced by vitest itself via vite.config.ts, so this step fails the
      # build on a regression. A previous hand-rolled 90% gate here read
      # coverage/coverage-summary.json, which is never generated (the reporters
      # are text/json/html/lcov) — `cat` failed, `jq` returned null, and the
      # check silently always passed. Removed rather than fixed: one threshold,
      # one source of truth.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Validate theme contrast (WCAG AA)
        run: npm run validate:contrast

      - name: Build production bundle
        run: npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Build & Deploy handled by Cloudflare Pages Git integration.
  # See: https://dash.cloudflare.com → Pages → nabu
  # NOTE: wrangler.toml's `name` is now "nabu". If the dashboard project is still
  # named "nebulakit", rename it there (or create "nabu" and re-point the Git
  # integration) so `wrangler pages deploy` and the dashboard agree.
