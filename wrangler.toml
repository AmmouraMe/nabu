# Pages project name. All bound resources below are Nabu's own, on the dedicated
# Ammoura account (756e4c695a0301d24f0440b9dd3741f7) — see the D1 block for why
# that matters. Serves nabu.ammoura.me; the ammoura.me zone deliberately stays on
# the personal David Monaghan account, so the custom domain is cross-account.
name = "nabu"
# Bumped from 2024-01-01 together with the nodejs_compat flag below. The built
# _worker.js imports `node:async_hooks` (SvelteKit's adapter-cloudflare needs it),
# and without the flag wrangler warns the Worker "may throw errors at runtime".
# 2024-09-23 is the date at which nodejs_compat switches to its v2 behaviour, which
# is the combination adapter-cloudflare expects. Safe to move here because nothing
# had ever been deployed against the old date.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# NOTE: `account_id` cannot live here. Pages configs reject it ("Configuration file
# for Pages projects does not support 'account_id'"), which fails every
# `wrangler pages …` command before it runs.
#
# It was here to let the local Workers AI binding pick an account non-interactively,
# since the wrangler OAuth login can see more than one. That job belongs to
# CLOUDFLARE_ACCOUNT_ID in .dev.vars (already set, and documented in
# .dev.vars.example) — the Ammoura account is 756e4c695a0301d24f0440b9dd3741f7.
# Every `wrangler …` command against this project needs that in the environment,
# since the login can see four accounts and this file cannot pin one.

# D1 Database — Nabu's own, on the Ammoura account.
# Created 2026-07-25 with: wrangler d1 create nabu-db
#
# History of this line, because it has been wrong twice:
#   1. It was copied verbatim from the convey.land project (database_id
#      bd776be3-…, KV 12a65763-…). D1 binds by *id*, so that pointed Nabu at
#      another project's database — and the migration filenames diverge from
#      0004 on, so applying Nabu's migrations there would have interleaved two
#      unrelated schemas in one d1_migrations table.
#   2. It then pointed at 3804142a-… on the *Space account, which owns no DNS
#      zone and so could never serve nabu.ammoura.me. That database is empty and
#      is being deleted.
# Do not reintroduce another project's or another account's IDs here.
#
# `preview_database_id` matters more than it looks. Without it, preview and branch
# deployments bind this same production database — while KV *does* get a separate
# preview namespace. That split is what made `/setup` bootstrappable on a public
# branch URL (empty preview KV, so the lock key was missing) while pointed at live
# production rows. Preview now gets its own database, so a branch deploy can never
# read or write production data.
#
# Cost of this line: migrations must be applied twice. Production:
#   wrangler d1 migrations apply nabu-db --remote
# Preview:
#   wrangler d1 migrations apply nabu-db --remote --preview
[[d1_databases]]
binding = "DB"
database_name = "nabu-db"
database_id = "0604dd51-85fe-4c8f-ad56-b71a3eb57156"
preview_database_id = "2ea88d9f-8b4b-4f61-93ea-86ffa434a7f0"
migrations_dir = "./migrations"

# KV Namespace — on the Ammoura account.
# Created 2026-07-25 with: wrangler kv namespace create KV   (and again with --preview)
[[kv_namespaces]]
binding = "KV"
id = "17817a9350af492aa3c889c704392f4f"
preview_id = "69e17c99477148da87a783fc62ee3ac0"

# R2 Bucket
# NOT YET CREATED: R2 is not enabled on the Ammoura account either (the API still
# returns 10042 — it is a per-account opt-in, not something the CLI can turn on;
# the wrangler OAuth token has no r2 scope at all). Enable R2 in the dashboard for
# account 756e4c69…, then: wrangler r2 bucket create nabu-files
# R2 binds by name, so this resolves as soon as the bucket exists. `BUCKET` has 17
# call sites (brand assets, generated media, video), so those paths fail until then.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nabu-files"

# Queue (disabled - enable Queues at https://dash.cloudflare.com before uncommenting)
# [[queues.producers]]
# binding = "QUEUE"
# queue = "nebulakit-queue"

# Note: queues.consumers is not supported by Cloudflare Pages
# If you need queue consumers, use a separate Cloudflare Worker

# Workers AI
# Free tier: https://developers.cloudflare.com/workers-ai/
[ai]
binding = "AI"

# Cron Triggers — NOT configurable here.
#
# Pages projects reject a [triggers] block outright ("Configuration file for Pages
# projects does not support 'triggers'"), which fails `wrangler pages secret put`
# and `wrangler pages deploy` before they do anything. The block that used to sit
# here (crons = ["0 9 * * 1"], Monday 9am UTC for the weekly content calendar) had
# therefore never taken effect — it only ever blocked deploys.
#
# That scheduler now exists as a separate Worker: `workers/content-cron/`, which
# calls `GET /api/cron/content` with `Authorization: Bearer <CRON_SECRET>` every
# Monday at 09:00 UTC. Note GET, not POST — the route exports `GET`; earlier notes
# here and in planning/decisions.md said POST and were wrong.
#
# Its CRON_SECRET is set and matches this project's. Its cron trigger is NOT yet
# registered: attaching a schedule needs the account's workers.dev subdomain to
# exist (API code 10063), which is created by opening the Workers page in the
# dashboard once. After that, re-run `wrangler deploy` in workers/content-cron.

# Environment Variables
# For production, set these in Cloudflare Pages settings
# For local dev, use .env file (see .env.example)
[vars]
# TURNSTILE_SECRET_KEY will be set via environment
# GitHub user ID that gets owner/admin rights. davis9001; public data, from
# https://api.github.com/users/davis9001. The callbacks check this env var first
# and fall back to KV `github_owner_id`. Leaving it unset makes isOwner false for
# everyone, which locks the admin panel to nobody.
GITHUB_OWNER_ID = "72961"
# Discord account id that gets owner/admin rights — davis9001. Public data, and the
# Discord-side counterpart to GITHUB_OWNER_ID above: owner used to be derived only
# from a GitHub id, which no Discord snowflake can ever match, so Discord logins were
# permanently locked out of /admin. The callbacks check this env var first and fall
# back to KV `discord_owner_id`.
DISCORD_OWNER_ID = "293484886726279168"
# CRON_SECRET - Random secret for authorizing the /api/cron/content endpoint
